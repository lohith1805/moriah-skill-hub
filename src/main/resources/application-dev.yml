# Local development — matches docker-compose.yml.
#
# `spring.config.import` below loads the project-root `.env` (KEY=VALUE, parsed as .properties)
# into the Environment so `${DB_HOST}` / `${DB_PORT}` / `${REDIS_HOST}` / … in application.yml
# resolve when the app is started on the host with `mvn spring-boot:run` or from an IDE.
# `optional:` = skipped silently if `.env` is absent. Dev-profile only — the `test` profile gets
# its datasource from Testcontainers `@ServiceConnection`, and `prod` uses real env vars / a
# secret store, so neither reads `.env`.
#
# `docker compose` reads the same `.env` natively for the mysql/redis/minio containers.
spring:
  config:
    import: "optional:file:./.env[.properties]"
  flyway:
    # Dev-only: add the sample-data location on top of the real migrations. `db/testdata/` holds
    # one repeatable migration (R__dev_seed_data.sql) that seeds the test accounts/batch/leads on
    # every `mvn spring-boot:run` — no separate script to run on a fresh machine. application.yml
    # (prod) and application-test.yml keep the default `classpath:db/migration` only, so this
    # sample data never reaches the test or production databases.
    locations: classpath:db/migration,classpath:db/testdata
  jpa:
    # show-sql is deliberately OFF: it writes raw SQL straight to System.out, bypassing the log
    # framework and duplicating every statement already emitted by `org.hibernate.SQL: DEBUG`
    # below. Formatting + bind values come from the two Hibernate loggers instead.
    show-sql: false
    properties:
      hibernate.format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

moriah:
  # There is no real read replica locally — docker-compose's `mysql-replica` is an unmanaged,
  # schema-less stand-in (replication setup is manual; see runbook-dr.md). MetricsService and
  # the admin exports query the replica pool *exclusively*, so point it at the primary here or
  # every /admin/metrics/* call 500s with "table doesn't exist". DB_REPLICA_HOST / DB_REPLICA_PORT
  # still override for anyone who has actually stood the replica up.
  datasource:
    replica:
      url: jdbc:mysql://${DB_REPLICA_HOST:${DB_HOST}}:${DB_REPLICA_PORT:${DB_PORT}}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173

logging:
  level:
    com.moriah.skillhub: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # the "?" placeholder values for each statement above
