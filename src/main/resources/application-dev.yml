# Local development — matches docker-compose.yml. Real secrets never live here; anything
# sensitive still comes from an env var, docker-compose.yml just supplies dev-only values for
# those env vars via its own environment block.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

moriah:
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173

logging:
  level:
    com.moriah.skillhub: DEBUG
    org.hibernate.SQL: DEBUG
